version: "3.9"

services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pedidos:
    build: ./services/pedidos

    ports:
      - "3001:3000"

  pagamentos:
    build: ./services/pagamentos

    ports:
      - "3002:3000"

  estoque:
    build: ./services/estoque

    ports:
      - "3003:3000"

  api-gateway:
    build: ./services/api-gateway

    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana

    ports:
      - "4000:3000"

volumes:
  postgres_data: