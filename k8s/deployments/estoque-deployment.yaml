apiVersion: apps/v1
kind: Deployment

metadata:
  name: estoque-deployment

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: estoque

  template:
    metadata:
      labels:
        app: estoque

    spec:
      containers:
        - name: estoque

          image: seuusuario/estoque:v1.0.0

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 20

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret

                