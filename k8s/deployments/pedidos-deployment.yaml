apiVersion: apps/v1
kind: Deployment

metadata:
  name: pedidos-deployment

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: pedidos

  template:
    metadata:
      labels:
        app: pedidos

    spec:
      containers:
        - name: pedidos

          image: brunofirmino/pedidos:v1.0.0

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 20

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret